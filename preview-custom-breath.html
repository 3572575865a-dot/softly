<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom breath · 本地预览</title><link rel="stylesheet" href="src/design/breathe.css"><link rel="stylesheet" href="src/design/mascot.css"><style>body{background:#e9e5e6;color:#847985;font:16px system-ui;padding:24px}main{display:flex;flex-wrap:wrap;gap:22px}section{width:240px;text-align:center;background:#fff3;border-radius:24px;padding:18px}svg.breathing-world{width:240px;height:240px}a{color:inherit}</style><p><a href="/">打开 App</a></p><main></main><script type="module">import{breathingWorld,paintBreathingWorld}from './src/components/breathing-world.js';import{customTechnique}from './src/features/breathe.js';import{mascot}from './src/components/mascot.js';const m=customTechnique([4,2,6,2]);for(const [name,index]of [['Inhale',0],['Hold',1],['Exhale',2]]){const el=document.createElement('section');el.innerHTML=breathingWorld('orb')+'<p>'+name+'</p>';document.querySelector('main').append(el);paintBreathingWorld(el.querySelector('svg'),{name,index,progress:.5,cycle:0},m);}const el=document.createElement('section');el.innerHTML=mascot({size:200,interactionMode:'home'})+'<p>Home</p>';document.querySelector('main').append(el);</script></html>
