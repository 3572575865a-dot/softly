<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Softly · iPhone 16 Pro 真机外观预览</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#faf9f8}
    body{display:grid;place-items:center;min-height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .stage{position:relative;flex:none}
    .phone{position:absolute;left:0;top:0;width:430px;height:902px;padding:12px;border:2px solid #353638;border-radius:64px;background:#202123;box-shadow:0 28px 70px #49414b28,0 5px 16px #49414b1a;transform-origin:top left}
    .phone::before,.phone::after{content:"";position:absolute;left:-6px;width:4px;border-radius:4px 0 0 4px;background:#323335}
    .phone::before{top:154px;height:32px}
    .phone::after{top:205px;height:66px}
    .power{position:absolute;right:-6px;top:222px;width:4px;height:75px;border-radius:0 4px 4px 0;background:#323335}
    .screen{position:relative;width:402px;height:874px;overflow:hidden;border-radius:51px;background:#e9e5e6}
    .status{position:absolute;left:0;right:0;top:0;height:62px;z-index:2;color:#454650;pointer-events:none}
    .clock{position:absolute;top:21px;left:33px;font-size:15px;font-weight:600;letter-spacing:-.25px;line-height:20px}
    .island{position:absolute;top:11px;left:50%;width:126px;height:37px;transform:translateX(-50%);border-radius:23px;background:#08090a;box-shadow:inset 0 1px 2px #313335}
    .island::after{content:"";position:absolute;right:14px;top:13px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#1d3240 0,#0d1720 38%,#020406 75%)}
    .indicators{position:absolute;top:22px;right:26px;display:flex;align-items:center;gap:6px;height:18px}
    .indicators svg{display:block;fill:currentColor;stroke:currentColor}
    .indicators .battery{width:27px;height:13px;fill:none;stroke-width:1.5}
    iframe{position:absolute;inset:0;width:402px;height:874px;border:0;background:#e9e5e6}
    .bottom{position:absolute;left:0;right:0;bottom:0;height:25px;pointer-events:none}
    .home-indicator{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:4px;background:#454650}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="stage" aria-label="iPhone 16 Pro 外观模拟，内部为可操作的 Softly 本地预览">
    <div class="phone">
      <span class="power" aria-hidden="true"></span>
      <div class="screen">
        <div class="status" aria-hidden="true">
          <span class="clock" id="clock">9:41</span>
          <span class="island"></span>
          <span class="indicators">
            <svg width="20" height="14" viewBox="0 0 20 14"><rect x="1" y="10" width="2" height="3" rx=".5"/><rect x="5" y="7" width="2" height="6" rx=".5"/><rect x="9" y="4" width="2" height="9" rx=".5"/><rect x="13" y="1" width="2" height="12" rx=".5"/></svg>
            <svg width="18" height="14" viewBox="0 0 18 14"><path d="M1 4.5c4.2-4 11.8-4 16 0M3.5 7c3-2.8 8-2.8 11 0M6.5 9.5c1.4-1.2 3.6-1.2 5 0" fill="none" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="12" r="1.2"/></svg>
            <svg class="battery" viewBox="0 0 27 13"><rect x="1" y="1" width="23" height="11" rx="2.5"/><path d="M26 4.5v4" stroke-linecap="round"/><rect x="3.5" y="3.5" width="18" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
          </span>
        </div>
        <iframe title="Softly 本地应用" src="./" loading="eager"></iframe>
        <div class="bottom" aria-hidden="true"><span class="home-indicator"></span></div>
      </div>
    </div>
  </main>
  <script>
    const stage=document.querySelector('.stage');
    const phone=document.querySelector('.phone');
    const appFrame=document.querySelector('iframe');
    function applySafeArea(){
      try{
        const root=appFrame.contentDocument.documentElement;
        root.style.setProperty('--safe-top','62px');
        root.style.setProperty('--safe-bottom','25px');
      }catch{}
    }
    function fit(){
      const scale=Math.min(1,(window.innerWidth-24)/430,(window.innerHeight-24)/902);
      stage.style.width=`${430*scale}px`;
      stage.style.height=`${902*scale}px`;
      phone.style.transform=`scale(${scale})`;
    }
    function time(){document.querySelector('#clock').textContent=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());}
    window.addEventListener('resize',fit);
    appFrame.addEventListener('load',applySafeArea);
    if(appFrame.contentDocument?.readyState==='complete')applySafeArea();
    fit();time();setInterval(time,30000);
  </script>
</body>
</html>
