<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound · 本地视觉预览</title><link rel="stylesheet" href="src/design/sound.css"><style>*{box-sizing:border-box}body{margin:0;background:#e9e5e6;color:#69616d;font:15px system-ui}header{padding:24px}h1{font-size:22px;font-weight:500}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;padding:0 24px 30px}.sample{min-height:400px;border:1px solid #fff8;border-radius:28px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse,#eddee3,transparent 75%)}.sample h2{font-size:15px;font-weight:500}.sample .sound-world{width:100%}</style><header><h1>Sound Space · 本地视觉预览</h1><p>统一浅粉灰色系 · 此页只展示动画，不播放音频</p><a href="/">打开完整 App</a></header><main class="grid"></main><script type="module">import{soundWorld,attachSoundWorld}from './src/components/sound-world.js';const cleanups=[];for(const [preset,label]of [['resonance','Frequency'],['liquid','Soft Music'],['fibers','ASMR'],['waves','Ocean'],['rain','Rain'],['brown','Brown Noise'],['campfire','Campfire'],['underwater','Underwater'],['wind','Wind'],['stream','Stream'],['brown2','Brown Noise 2']]){const el=document.createElement('section');el.className='sample';el.innerHTML='<h2>'+label+'</h2>'+soundWorld(preset);document.querySelector('main').append(el);cleanups.push(attachSoundWorld(el));}window.addEventListener('pagehide',()=>cleanups.forEach(f=>f()),{once:true});</script></html>
