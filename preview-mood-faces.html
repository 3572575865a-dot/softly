<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mood · 固定表情预览</title><style>body{background:#e9e5e6;color:#6f626c;font:15px system-ui;margin:24px}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.sample{text-align:center;background:#fff3;border-radius:22px;padding:12px}.sample svg{width:150px;max-width:100%}h1{font-size:22px}h2{font-size:16px;font-weight:500}</style><h1>每日软糖 · 表情对应</h1><p><a href="/">打开 App</a> · 此页为示例，不保存情绪记录。</p><div class="grid" id="faces"></div><h2>混色保留，最高占比决定表情</h2><div class="grid" id="mixed"></div><script type="module">import{gummy}from './src/components/gummy.js';import{emotions,deriveDayGummy}from './src/features/mood-data.js';for(const {emotionType}of emotions){document.querySelector('#faces').insertAdjacentHTML('beforeend','<div class="sample">'+gummy([{emotionType,weight:100}])+'<p>'+emotionType+'</p></div>');}for(const [label,items]of [['Happy 主导',[['Happy',40],['Calm',35],['Sad',25]]],['Sad 主导',[['Happy',25],['Calm',35],['Sad',40]]],['并列 · 最近 Anxious',[['Happy',50],['Anxious',50]]],['未记录',[]]]){document.querySelector('#mixed').insertAdjacentHTML('beforeend','<div class="sample">'+gummy(items.map(([emotionType,weight])=>({emotionType,weight})))+'<p>'+label+'</p></div>');}</script></html>
